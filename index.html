<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>マイ家計簿</title>
    <!-- PWA & iOS設定 -->
    <link rel="apple-touch-icon" href="icon.jpg">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8f9fa;
            color: #333333;
            margin: 0;
            padding: 15px;
            padding-bottom: 50px;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 { font-size: 1.4rem; margin-bottom: 15px; text-align: center; }
        .card {
            background: #ffffff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 15px;
            border: 1px solid #e0e0e0;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1rem;
            background: #ffffff;
            color: #333333;
        }
        button {
            background-color: #007aff;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { opacity: 0.8; }
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #e0e0e0;
        }
        .delete-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            width: auto;
            margin: 0;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>マイ家計簿</h1>

    <!-- 入力フォーム -->
    <div class="card">
        <h3>✍️ 収支の記録</h3>
        <input type="text" id="desc" placeholder="内容（例：スーパー）">
        <input type="number" id="amount" placeholder="金額（円）">
        <select id="category">
            <option value="食費">食費</option>
            <option value="交通費">交通費</option>
            <option value="娯楽">娯楽</option>
            <option value="その他">その他</option>
        </select>
        <button onclick="addTransaction()">追加する</button>
    </div>

    <!-- 合計と履歴 -->
    <div class="card">
        <h3>📋 履歴一覧</h3>
        <p id="totalDisplay" style="font-weight: bold; margin-bottom: 10px;">合計支出: 0円</p>
        <ul id="transactionList"></ul>
    </div>

    <!-- バックアップボタン -->
    <div style="text-align: center; margin-bottom: 20px;">
        <button onclick="exportData()" style="background: #5856d6; width: auto; display: inline-block; padding: 8px 16px;">データ書き出し (JSON)</button>
    </div>
</div>

<script>
    let transactions = JSON.parse(localStorage.getItem('transactions')) || [];

    window.onload = function() {
        renderApp();
    };

    function addTransaction() {
        const desc = document.getElementById('desc').value;
        const amount = Number(document.getElementById('amount').value);
        const category = document.getElementById('category').value;

        if(!desc || !amount) {
            alert('内容と金額を入力してね！');
            return;
        }

        transactions.unshift({
            id: Date.now(),
            desc,
            amount,
            category,
            date: new Date().toLocaleDateString()
        });

        document.getElementById('desc').value = '';
        document.getElementById('amount').value = '';
        saveAndRender();
    }

    function deleteTransaction(id) {
        transactions = transactions.filter(t => t.id !== id);
        saveAndRender();
    }

    function saveAndRender() {
        localStorage.setItem('transactions', JSON.stringify(transactions));
        renderApp();
    }

    function renderApp() {
        const listEl = document.getElementById('transactionList');
        listEl.innerHTML = '';
        let total = 0;

        transactions.forEach(t => {
            total += t.amount;
            const li = document.createElement('li');
            li.innerHTML = `
                <span><b>${t.desc}</b> (${t.category})<br><small style="color:#666;">${t.date}</small></span>
                <span>
                    ¥${t.amount.toLocaleString()} 
                    <button class="delete-btn" onclick="deleteTransaction(${t.id})">削除</button>
                </span>
            `;
            listEl.appendChild(li);
        });

        document.getElementById('totalDisplay').innerText = `合計支出: ¥${total.toLocaleString()}`;
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(transactions));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", "kakeibo_backup.json");
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
    }
</script>
</body>
</html>
