<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家計簿アプリ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- ヘッダー -->
    <header class="header">
      <h1>家計簿</h1>
      <div class="header-buttons">
        <button id="openSettings" class="icon-button" title="設定">⚙️</button>
        <button id="toggleBalanceButton" class="icon-button" title="残高非表示切り替え">👁️</button>
      </div>
    </header>

    <!-- 残高カードエリア -->
    <section class="balance-section">
      <div class="balance-card">
        <span class="account-label">現金</span>
        <span id="cashBalance" class="balance-amount">¥0</span>
      </div>
      <div class="balance-card">
        <span class="account-label">Olive</span>
        <span id="oliveBalance" class="balance-amount">¥0</span>
      </div>
      <div class="balance-card">
        <span class="account-label">PayPay</span>
        <span id="paypayBalance" class="balance-amount">¥0</span>
      </div>
      <div class="balance-card">
        <span class="account-label">Suica</span>
        <span id="suicaBalance" class="balance-amount">¥0</span>
      </div>
    </section>

    <!-- 今月のサマリー -->
    <section class="summary-section">
      <div class="summary-item">
        <span class="summary-label">今月の収入</span>
        <span id="monthlyIncome" class="summary-value income">+¥0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">今月の支出</span>
        <span id="monthlyExpense" class="summary-value expense">-¥0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">収支</span>
        <span id="monthlyBalance" class="summary-value">¥0</span>
      </div>
    </section>

    <!-- 取引リストエリア -->
    <section class="transaction-section">
      <div class="section-header">
        <h2>取引履歴</h2>
        <button id="addButton" class="primary-button">+ 取引を追加</button>
      </div>
      <div id="transactionList" class="transaction-list">
        <!-- 動的に挿入されます -->
      </div>
    </section>

    <!-- データ管理ボタン -->
    <section class="data-management">
      <button id="exportButton" class="secondary-button">バックアップ（保存）</button>
      <button id="importButton" class="secondary-button">データを復元</button>
      <input type="file" id="importFile" accept=".json" style="display: none;">
    </section>
  </div>

  <!-- 取引追加・編集モーダル -->
  <div id="modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modalTitle">取引を追加</h2>

      <!-- 種類選択ボタン -->
      <div class="form-group">
        <label>種類</label>
        <div class="button-group">
          <button type="button" class="type-button selected" data-type="expense">支出</button>
          <button type="button" class="type-button" data-type="income">収入</button>
          <button type="button" class="type-button" data-type="transfer">口座移動</button>
        </div>
      </div>

      <!-- タイトル（クイック選択付き） -->
      <div class="form-group">
        <label>タイトル</label>
        <input type="text" id="titleInput" placeholder="例: 昼食、給料など">
        <div id="quickTitlesContainer" class="quick-titles">
          <!-- 動的生成 -->
        </div>
      </div>

      <!-- 金額 -->
      <div class="form-group">
        <label>金額</label>
        <input type="number" id="amountInput" placeholder="0">
      </div>

      <!-- ★ここに追加：個別非表示チェックボックス -->
      <div class="form-group" style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
        <input type="checkbox" id="hideAmountInput" style="width: 20px; height: 20px; accent-color: var(--text-main); cursor: pointer;">
        <label for="hideAmountInput" style="margin-bottom: 0; cursor: pointer; font-size: 14px;">この取引の金額を履歴で非表示にする</label>
      </div>

      <!-- 通常の口座選択 -->
      <div id="accountArea" class="form-group">
        <label>口座</label>
        <div class="button-group">
          <button type="button" class="account-button selected" data-account="cash">現金</button>
          <button type="button" class="account-button" data-account="olive">Olive</button>
          <button type="button" class="account-button" data-account="paypay">PayPay</button>
          <button type="button" class="account-button" data-account="suica">Suica</button>
        </div>
      </div>

      <!-- 口座移動用エリア -->
      <div id="transferArea" class="form-group hidden">
        <label>移動元</label>
        <div class="button-group">
          <button type="button" class="from-button selected" data-account="cash">現金</button>
          <button type="button" class="from-button" data-account="olive">Olive</button>
          <button type="button" class="from-button" data-account="paypay">PayPay</button>
          <button type="button" class="from-button" data-account="suica">Suica</button>
        </div>
        <label style="margin-top: 10px;">移動先</label>
        <div class="button-group">
          <button type="button" class="to-button" data-account="cash">現金</button>
          <button type="button" class="to-button selected" data-account="olive">Olive</button>
          <button type="button" class="to-button" data-account="paypay">PayPay</button>
          <button type="button" class="to-button" data-account="suica">Suica</button>
        </div>
      </div>

      <!-- モーダル操作ボタン -->
      <div class="modal-buttons">
        <button type="button" id="closeModal" class="cancel-button">キャンセル</button>
        <button type="button" id="saveTransaction" class="primary-button">追加する</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="settingsModal" class="modal hidden">
    <div class="modal-content">
      <h2>クイックタイトルの編集</h2>
      <div class="form-group">
        <label>新しいタイトルを追加</label>
        <div style="display: flex; gap: 8px;">
          <input type="text" id="newQuickTitleInput" placeholder="例: カフェ" style="flex: 1;">
          <button type="button" id="addQuickTitleButton" class="primary-button" style="width: auto; padding: 0 16px;">追加</button>
        </div>
      </div>
      <div class="form-group">
        <label>現在のタイトル一覧（×で削除）</label>
        <div id="settingsQuickList" style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px;">
          <!-- 動的生成 -->
        </div>
      </div>
      <div class="modal-buttons" style="margin-top: 20px;">
        <button type="button" id="closeSettingsModal" class="primary-button" style="width: 100%;">閉じる</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
